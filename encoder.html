<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PFP STEGANOGRAPHY INJECTOR</title>
<style>
body { background: #030303; color: #00ff41; font-family: monospace; text-align: center; padding: 40px 15px; }
.card { border: 1px solid #00ff41; padding: 25px; max-width: 480px; margin: auto; box-shadow: 0 0 25px rgba(0,255,65,0.2); background: #080808; border-radius: 4px; }
input[type="file"] { display: none; }
.btn { background: #00ff41; color: #000; padding: 12px 20px; font-weight: bold; border: none; cursor: pointer; display: inline-block; margin-top: 15px; width: 100%; font-family: monospace; font-size: 0.95rem; }
#preview { max-width: 100%; max-height: 250px; margin: 15px auto; border: 1px dashed #00ff41; display: none; }
</style>
</head>
<body>
<div class="card">
  <h2>[ PFP STEGANOGRAPHY INJECTOR ]</h2>
  <p style="color:#aaa; font-size:0.85rem;">Select your anime avatar from gallery to inject the secret key for Tier 008:</p>
  
  <label class="btn" style="background:#00e5ff; color:#000;">
    📁 ВЫБРАТЬ АНИМЕ-ФОТО ИЗ ГАЛЕРЕИ
    <input type="file" id="photoInput" accept="image/*">
  </label>
  
  <img id="preview">
  
  <button id="dlBtn" class="btn" style="display:none; background:#50fa7b;">🔒 СКАЧАТЬ ЗАШИФРОВАННЫЙ PFP (.PNG)</button>
  <div id="status" style="margin-top:15px; color:#50fa7b; font-size:0.85rem;"></div>
</div>

<script>
let imgBytes = null;
const input = document.getElementById('photoInput');
const preview = document.getElementById('preview');
const dlBtn = document.getElementById('dlBtn');
const status = document.getElementById('status');

input.addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(evt) {
    const arrayBuffer = evt.target.result;
    const uint8 = new Uint8Array(arrayBuffer);
    
    // Вшиваем секретный ключ для Уровня 8
    const secretStr = "\n\n--- [OBSERVER_CIPHER]: WANDERER_AT_EVENT_HORIZON ---\n";
    const secretBytes = new TextEncoder().encode(secretStr);
    
    const combined = new Uint8Array(uint8.length + secretBytes.length);
    combined.set(uint8, 0);
    combined.set(secretBytes, uint8.length);
    
    imgBytes = combined;
    
    const blob = new Blob([combined], { type: 'image/png' });
    preview.src = URL.createObjectURL(blob);
    preview.style.display = 'block';
    dlBtn.style.display = 'block';
    status.innerText = "✅ Ключ WANDERER_AT_EVENT_HORIZON успешно вшит в байты фото!";
  };
  reader.readAsArrayBuffer(file);
});

dlBtn.addEventListener('click', function() {
  if (!imgBytes) return;
  const blob = new Blob([imgBytes], { type: 'image/png' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pfp_encoded.png';
  a.click();
});
</script>
</body>
</html>
