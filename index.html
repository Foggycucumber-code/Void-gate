<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>THE VOID MONOLITH // 133 TIERS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #020202;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
            transition: color 0.4s ease;
        }
        .terminal {
            background: #060606;
            border: 1px solid #00ff41;
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.15);
            padding: 25px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            border-radius: 4px;
            position: relative;
        }
        .header-tag { font-size: 0.72rem; letter-spacing: 2px; color: #777; margin-bottom: 5px; }
        h1, h2 { font-size: 1.05rem; margin-bottom: 15px; border-bottom: 1px dashed currentColor; padding-bottom: 8px; }
        p { font-size: 0.85rem; line-height: 1.6; margin-bottom: 15px; }
        .quote { font-style: italic; opacity: 0.75; font-size: 0.8rem; }
        input[type="text"] {
            width: 100%;
            background: #000;
            border: 1px solid currentColor;
            color: #fff;
            padding: 12px;
            font-family: monospace;
            font-size: 0.95rem;
            margin: 12px 0;
            outline: none;
            text-align: center;
        }
        button, .btn {
            width: 100%;
            background: #00ff41;
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-family: monospace;
            cursor: pointer;
            font-size: 0.95rem;
            display: inline-block;
            text-decoration: none;
            letter-spacing: 1px;
            user-select: none;
        }
        button:active, .btn:active { transform: scale(0.98); opacity: 0.85; }
        #log { margin-top: 15px; font-size: 0.85rem; min-height: 25px; line-height: 1.4; }
        .hidden { display: none !important; }
        #canvas-box { position: relative; width: 100%; height: 260px; margin: 15px 0; }
        canvas { width: 100%; height: 100%; display: block; border-radius: 3px; }
        .hex-dump {
            background: #000;
            border: 1px solid currentColor;
            padding: 10px;
            font-size: 0.72rem;
            text-align: left;
            word-break: break-all;
            margin: 12px 0;
            line-height: 1.5;
            max-height: 110px;
            overflow-y: auto;
        }
        .meta-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #555;
            margin-top: 15px;
            border-top: 1px solid #222;
            padding-top: 8px;
        }
        .glitch-lock { 
            border-color: #ff0055 !important; 
            color: #ff0055 !important; 
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.5) !important; 
        }
        .whiteout { background: #fff !important; color: #000 !important; box-shadow: 0 0 50px #fff !important; }
    </style>
</head>
<body>

    <div class="terminal" id="terminal-box">
        <div class="header-tag" id="epoch-tag">EPOCH I // RELATIVISTIC SPACETIME</div>
        <h1 id="tier-title">[ TIER 001 // NULL_COLLAPSE ]</h1>
        
        <div id="canvas-box" class="hidden"><canvas id="main-canvas"></canvas></div>

        <div id="audio-box" class="hidden">
            <audio controls src="anomaly.wav" style="width: 100%; margin: 10px 0;"></audio><br>
            <a href="anomaly.wav" download="anomaly.wav" class="btn" style="background:#00e5ff; margin-bottom:15px; color:#000;">DOWNLOAD WAV STREAM</a>
        </div>

        <div id="hex-box" class="hex-dump hidden"></div>

        <p id="task-desc">EVALUATE THE IDENTITY:<br><code>e<sup>iπ</sup> + 1 = ?</code></p>
        <p id="sub-desc" class="quote">"The portal detects observation weight. Bring no substance."</p>

        <form id="master-form" onsubmit="return false;">
            <input type="text" id="pass-input" placeholder="Awaiting observer input..." autocomplete="off">
            <button type="button" id="submit-btn">TRANSMIT TO VOID</button>
        </form>

        <div id="log"></div>

        <div class="meta-info">
            <span id="tier-counter">TIER: 001 / 133</span>
            <span id="strikes-tag">ATTEMPTS: 3 / 3</span>
            <span id="epoch-status">SECTORS: 133 COMPILED</span>
        </div>
    </div>

    <!-- ПОДКЛЮЧАЕМ НАШИ МОДУЛИ -->
    <script src="visuals.js"></script>
    <script src="database.js"></script>

    <!-- ОСНОВНОЙ ДВИЖОК С ЭНЕРГОНЕЗАВИСИМОЙ ПАМЯТЬЮ -->
    <script>
        let currentTier = 1;
        let strikes = parseInt(localStorage.getItem('__void_strikes') || "3");
        let isLocked = false;
        let lockTimer = null;

        const terminalBox = document.getElementById('terminal-box');
        const epochTag = document.getElementById('epoch-tag');
        const tierTitle = document.getElementById('tier-title');
        const taskDesc = document.getElementById('task-desc');
        const subDesc = document.getElementById('sub-desc');
        const passInput = document.getElementById('pass-input');
        const submitBtn = document.getElementById('submit-btn');
        const log = document.getElementById('log');
        const tierCounter = document.getElementById('tier-counter');
        const strikesTag = document.getElementById('strikes-tag');
        const canvasBox = document.getElementById('canvas-box');
        const audioBox = document.getElementById('audio-box');
        const hexBox = document.getElementById('hex-box');
        const canvas = document.getElementById('main-canvas');

        // ПРОВЕРКА СОХРАНЕННОЙ БЛОКИРОВКИ ПРИ ЗАГРУЗКЕ
        function checkPersistentLock() {
            const lockUntil = parseInt(localStorage.getItem('__void_lock_until') || "0");
            const now = Date.now();
            if (lockUntil > now) {
                const remainingSecs = Math.ceil((lockUntil - now) / 1000);
                triggerLockout("PERSISTENT DECOHERENCE ACTIVE. NO ESCAPE VIA RELOAD.", remainingSecs);
                return true;
            } else {
                localStorage.removeItem('__void_lock_until');
                return false;
            }
        }

        function loadTier(tNum) {
            if (checkPersistentLock()) return;

            currentTier = tNum;
            tierCounter.innerText = `TIER: ${String(tNum).padStart(3, '0')} / 133`;
            strikesTag.innerText = `ATTEMPTS: ${strikes} / 3`;

            if (tNum > 133) return;

            const t = window.MASTER_DB[tNum];
            if (!t) return;

            document.body.style.color = t[4];
            terminalBox.style.borderColor = t[4];
            terminalBox.style.boxShadow = `0 0 30px ${t[4]}33`;
            submitBtn.style.background = t[4];
            submitBtn.style.color = (t[4] === "#ffffff" || t[4] === "#f1fa8c" || t[4] === "#50fa7b") ? "#000" : "#000";

            epochTag.innerText = t[0];
            tierTitle.innerHTML = t[1];
            taskDesc.innerHTML = t[2];
            subDesc.innerHTML = t[3];
            submitBtn.innerText = t[5] || "TRANSMIT KEY";
            passInput.value = "";
            log.innerHTML = "";

            if (window.stopVisuals) window.stopVisuals();
            canvasBox.classList.add('hidden');
            audioBox.classList.add('hidden');
            hexBox.classList.add('hidden');

            if (t[6] === "audio") audioBox.classList.remove('hidden');
            if (t[8] === "hex") {
                hexBox.innerText = "[XOR_MASK: 0x5A]\n71 7E 77 74 74 74 74 74 74 74 74 38 7B 77 77 77 77 77 77 77 77 74 74 74 74 74 74 74 74 74 38 77 77 77 77 77 77 77 77 74 74 74 74 74 74 74 74 74 74 74 38 7B 7B 7B 77 74 74 74 74 74 74 74 74 38 7B 7B 7B 7B 77 74 74 74 74 74 74 74 74 74 39 39 39 39 39 39 39 70 38 76 77 77 77 77 77 77 77 77 77 77 77 77 77 77 77 77 77 77 77 77 77 77 77 77 70";
                hexBox.classList.remove('hidden');
            }
            if (t[6] && window.startVisual) {
                canvasBox.classList.remove('hidden');
                window.startVisual(t[6], canvas, canvasBox);
            }
        }

        function handleValidation() {
            if (isLocked || checkPersistentLock()) return;

            const val = passInput.value.trim().toUpperCase();
            const t = window.MASTER_DB[currentTier];
            if (!t) return;

            const HONEYPOTS = ["PASSWORD", "ADMIN", "CICADA", "CICADA3301", "FLAG", "ROOT", "TEST"];
            if (HONEYPOTS.includes(val)) {
                strikes = 0;
                localStorage.setItem('__void_strikes', "0");
                triggerLockout("HONEYPOT TRIGGERED. PROGRESS CORRUPTED.", 300);
                return;
            }

            let correct = false;
            if (currentTier === 1 && val === "") correct = true;
            else if (currentTier === 1 && val === "0") {
                log.style.color = "#ff3333";
                log.innerText = "[ERROR 0x01]: You provided '0'. The void demands ABSENCE.";
                return;
            } else if (t[7].includes(val)) {
                correct = true;
            }

            if (correct) {
                strikes = 3;
                localStorage.setItem('__void_strikes', "3");
                localStorage.removeItem('__void_lock_until');

                if (currentTier === 133) {
                    if (window.stopVisuals) window.stopVisuals();
                    document.body.classList.add('whiteout');
                    terminalBox.innerHTML = `
                        <h1 style="color:#000; font-size:1.3rem;">[ GRAND OBSERVATION COLLAPSE ]</h1>
                        <p style="color:#000; font-size:1rem; margin:20px 0;">
                            <b>VOLUME 01 OF 14 COMPLETED.</b><br>
                            ALL 133 QUANTUM SECTORS ANNIHILATED.
                        </p>
                        <div style="background:#000; color:#fff; padding:20px; font-size:1.2rem; font-weight:bold; letter-spacing:4px; margin:20px 0;">
                            REVEALED FRAGMENT: "COLLAPSE"<br>
                            <span style="font-size:0.75rem; color:#888;">[POSITION: 08 / 14]</span>
                        </div>
                        <p style="color:#333; font-size:0.8rem;">
                            The first word of Ω_Omni has been harvested.<br>
                            Prepare for Volume 02: 142 Tiers of Transfinite Ordinals.
                        </p>
                    `;
                    return;
                }

                log.style.color = "#50fa7b";
                log.innerText = `[SUCCESS]: Tier ${currentTier} Cleared. Decrypting Tier ${currentTier + 1}...`;
                setTimeout(() => {
                    loadTier(currentTier + 1);
                }, 350);
            } else {
                strikes--;
                localStorage.setItem('__void_strikes', String(strikes));
                strikesTag.innerText = `ATTEMPTS: ${strikes} / 3`;
                if (strikes <= 0) {
                    triggerLockout("QUANTUM DECOHERENCE: 3 STRIKES REACHED. LOCKDOWN ENGAGED.", 300);
                } else {
                    log.style.color = "#ff3333";
                    log.innerText = `[REJECTED]: Waveform collapsed. ${strikes} attempts remaining.`;
                }
            }
        }

        submitBtn.addEventListener('click', handleValidation);
        document.getElementById('master-form').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleValidation();
            }
        });

        // НЕПРОБИВАЕМЫЙ ЛОКДАУН (ПЕРСИСТЕНТНЫЙ ТАЙМЕР)
        function triggerLockout(reason, durationSeconds) {
            isLocked = true;
            terminalBox.classList.add('glitch-lock');

            const now = Date.now();
            let lockUntil = parseInt(localStorage.getItem('__void_lock_until') || "0");
            if (lockUntil <= now) {
                lockUntil = now + (durationSeconds * 1000);
                localStorage.setItem('__void_lock_until', String(lockUntil));
            }

            if (lockTimer) clearInterval(lockTimer);

            lockTimer = setInterval(() => {
                const currentNow = Date.now();
                const remaining = Math.max(0, Math.ceil((lockUntil - currentNow) / 1000));
                
                log.style.color = "#ff0055";
                log.innerHTML = `<b>[SYSTEM LOCKED]</b><br>${reason}<br>COOLDOWN: ${remaining}s<br><span style="font-size:0.7rem; color:#888;">Lock persists across reloads.</span>`;

                if (remaining <= 0) {
                    clearInterval(lockTimer);
                    isLocked = false;
                    strikes = 3;
                    localStorage.setItem('__void_strikes', "3");
                    localStorage.removeItem('__void_lock_until');
                    terminalBox.classList.remove('glitch-lock');
                    loadTier(1);
                }
            }, 1000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (!checkPersistentLock() && window.MASTER_DB) {
                loadTier(1);
            }
        });
    </script>
</body>
</html>
