<!DOCTYPE html>
<html lang="la">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>0x03 // TESSERACT PROJECTION</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #030106;
            color: #bd93f9;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
            cursor: grab;
        }
        .quote {
            position: absolute;
            bottom: 30px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #6272a4;
            text-align: center;
            padding: 0 15px;
            font-style: italic;
            user-select: none;
        }
        #secret-reveal {
            display: none;
            position: absolute;
            top: 25px;
            font-size: 0.8rem;
            color: #50fa7b;
            text-shadow: 0 0 10px #50fa7b;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>
    <div id="secret-reveal">[ ANOMALY ALIGNED: 0x04_ENTROPY_WELL.html ]</div>
    <canvas id="tesseract"></canvas>
    <div class="quote">"Umbra in quattuor dimensionibus non est nihil."</div>

    <script>
        // Инициализация Canvas
        const canvas = document.getElementById('tesseract');
        const ctx = canvas.getContext('2d');
        const reveal = document.getElementById('secret-reveal');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 16 вершин 4D-гиперкуба (x, y, z, w)
        const vertices = [];
        for (let i = 0; i < 16; i++) {
            vertices.push([
                (i & 1) ? 1 : -1,
                (i & 2) ? 1 : -1,
                (i & 4) ? 1 : -1,
                (i & 8) ? 1 : -1
            ]);
        }

        // 32 ребра тессеракта
        const edges = [];
        for (let i = 0; i < 16; i++) {
            for (let j = i + 1; j < 16; j++) {
                let diff = 0;
                for (let k = 0; k < 4; k++) {
                    if (vertices[i][k] !== vertices[j][k]) diff++;
                }
                if (diff === 1) edges.push([i, j]);
            }
        }

        // Углы вращения в 4D плоскостях
        let angleXW = 0, angleYW = 0, angleZW = 0;
        let isInteracting = false;
        let lastX = 0, lastY = 0;

        // Сенсорное управление и мышь для вращения в 4-м измерении
        function start(e) {
            isInteracting = true;
            const t = e.touches ? e.touches[0] : e;
            lastX = t.clientX;
            lastY = t.clientY;
        }
        function move(e) {
            if (!isInteracting) return;
            const t = e.touches ? e.touches[0] : e;
            const dx = t.clientX - lastX;
            const dy = t.clientY - lastY;
            angleXW += dx * 0.01;
            angleYW += dy * 0.01;
            lastX = t.clientX;
            lastY = t.clientY;
            checkResonance();
        }
        function end() { isInteracting = false; }

        window.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
        window.addEventListener('touchstart', start);
        window.addEventListener('touchmove', move);
        window.addEventListener('touchend', end);

        // Магическое 4D-состояние резонанса
        function checkResonance() {
            // Если игрок нащупал определенный угол проекции
            const normX = Math.abs(angleXW % Math.PI);
            if (normX > 1.5 && normX < 1.65) {
                reveal.style.display = 'block';
            }
        }

        // Скрытый лог для тех, кто полезет в DevTools / консоль
        console.log("%c[SECTOR 03]: 4D Topology Matrix Initialized.", "color: #bd93f9; font-size: 13px;");
        console.log("%cHint: The shadow reveals its seed at XW-plane orthogonal angle (PI / 2).", "color: #6272a4; font-style: italic;");
        console.log("%cKey Destination: 0x04_ENTROPY_WELL.html", "color: #030106; font-size: 1px;"); // Скрыто в цвете фона

        function rotateXW(p, a) {
            const cos = Math.cos(a), sin = Math.sin(a);
            return [p[0] * cos - p[3] * sin, p[1], p[2], p[0] * sin + p[3] * cos];
        }
        function rotateYW(p, a) {
            const cos = Math.cos(a), sin = Math.sin(a);
            return [p[0], p[1] * cos - p[3] * sin, p[2], p[1] * sin + p[3] * cos];
        }

        function project(p4) {
            const d4 = 2.8, d3 = 3.2;
            const w_proj = 1 / (d4 - p4[3]);
            const p3 = [p4[0] * w_proj, p4[1] * w_proj, p4[2] * w_proj];
            const z_proj = 1 / (d3 - p3[2]);
            const scale = Math.min(canvas.width, canvas.height) * 0.4;
            return [
                p3[0] * z_proj * scale + canvas.width / 2,
                p3[1] * z_proj * scale + canvas.height / 2
            ];
        }

        function draw() {
            ctx.fillStyle = '#030106';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!isInteracting) {
                angleXW += 0.007;
                angleYW += 0.005;
                checkResonance();
            }

            const projected = vertices.map(v => {
                let p = rotateXW(v, angleXW);
                p = rotateYW(p, angleYW);
                return project(p);
            });

            ctx.lineWidth = 1.2;
            edges.forEach(([i, j]) => {
                const grad = ctx.createLinearGradient(projected[i][0], projected[i][1], projected[j][i] || projected[j][0], projected[j][1]);
                grad.addColorStop(0, 'rgba(189, 147, 249, 0.7)');
                grad.addColorStop(1, 'rgba(139, 233, 253, 0.3)');
                ctx.strokeStyle = grad;
                ctx.beginPath();
                ctx.moveTo(projected[i][0], projected[i][1]);
                ctx.lineTo(projected[j][0], projected[j][1]);
                ctx.stroke();
            });

            // Рисуем квантовые вершины
            projected.forEach(([x, y]) => {
                ctx.fillStyle = '#ff79c6';
                ctx.beginPath();
                ctx.arc(x, y, 2.5, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
