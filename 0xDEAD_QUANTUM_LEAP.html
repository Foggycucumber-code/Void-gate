<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREQUENCY ZERO // SECTOR 02</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #020202;
            color: #00e5ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .box {
            border: 1px solid #00e5ff;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.2);
            padding: 30px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            background: #060606;
            border-radius: 4px;
        }
        h2 { font-size: 1.1rem; border-bottom: 1px dashed #00e5ff; padding-bottom: 15px; margin-top: 0; }
        p { font-size: 0.85rem; color: #a0f0ff; line-height: 1.6; }
        audio { margin: 25px 0 15px 0; width: 100%; }
        .download-btn {
            display: inline-block;
            background: #00e5ff;
            color: #000;
            text-decoration: none;
            padding: 12px 20px;
            font-weight: bold;
            margin-top: 15px;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        .download-btn:hover { background: #00b3cc; }
        .hint { color: #555; font-size: 0.75rem; margin-top: 25px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>[ LEVEL 02 // ZERO_FREQUENCY_BEACON ]</h2>
        <p>The transmission arrived from beyond the event horizon.<br>Human ears only hear chaos.<br><b>Look into the frequencies to see the message.</b></p>
        
        <audio controls src="anomaly.wav"></audio><br>
        
        <a href="anomaly.wav" download="anomaly.wav" class="download-btn">DOWNLOAD AUDIO STREAM (.WAV)</a>
        
        <p class="hint">
            Target: Audio Spectrum Analysis.<br>
            Extract the passkey to proceed to Level 03.
        </p>
    </div>
</body>
</html>
